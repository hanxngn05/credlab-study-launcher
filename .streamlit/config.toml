[theme]
base = "light"
primaryColor = "#245d50"
backgroundColor = "#f6f5f1"
secondaryBackgroundColor = "#e9eee7"
textColor = "#202d2a"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
# Preserve interview widgets during brief Wi-Fi drops or laptop network changes.
disconnectedSessionTTL = 300
